<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Countersign simulator</title>
    <style>
      :root {
        --bg: #f6f5f2;
        --panel: #ffffff;
        --ink: #1d1d1f;
        --muted: #6b6b70;
        --line: #e3e1dc;
        --accent: #0f6e6e;
        --ok: #1f7a3a;
        --warn: #a15c00;
        --stop: #b3261e;
        --wait: #4a4fb5;
        --bubble-you: #e8f2f2;
        --bubble-dev: #f1f0ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141416;
          --panel: #1d1d20;
          --ink: #ececee;
          --muted: #9a9aa2;
          --line: #2e2e33;
          --accent: #4fc1c1;
          --ok: #5fcf7f;
          --warn: #e5a34a;
          --stop: #f07068;
          --wait: #9aa0ff;
          --bubble-you: #17302f;
          --bubble-dev: #26262a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.45 -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
      }
      header span {
        color: var(--muted);
        font-size: 13px;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        gap: 16px;
        padding: 16px 20px;
        max-width: 1280px;
        margin: 0 auto;
      }
      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
          padding: 12px 16px;
        }
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        min-width: 0;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 10px;
      }
      .speakers {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .speaker {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
        font: inherit;
      }
      .speaker small {
        color: var(--muted);
        margin-left: 4px;
      }
      .speaker[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--bubble-you);
      }
      #log {
        height: 52vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 4px;
      }
      .msg {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 12px;
        white-space: pre-wrap;
      }
      .msg.you {
        align-self: flex-end;
        background: var(--bubble-you);
      }
      .msg.dev {
        align-self: flex-start;
        background: var(--bubble-dev);
      }
      .msg .who {
        font-size: 12px;
        color: var(--muted);
        display: block;
      }
      .msg.err {
        background: transparent;
        border: 1px solid var(--stop);
        color: var(--stop);
      }
      form {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      input[type="text"] {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        font: inherit;
      }
      button.primary,
      button.mic {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button.mic.on {
        background: var(--stop);
      }
      .row {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .row button {
        background: none;
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 8px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      .redteam {
        color: var(--stop);
        font-weight: 600;
      }
      .call {
        border-top: 1px solid var(--line);
        padding: 8px 0;
        font-size: 13px;
      }
      .call code {
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
      }
      .chip {
        display: inline-block;
        border-radius: 999px;
        padding: 1px 8px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid currentColor;
        margin-left: 6px;
      }
      .placed,
      .verified {
        color: var(--ok);
      }
      .needs_confirmation {
        color: var(--warn);
      }
      .needs_approval {
        color: var(--wait);
      }
      .blocked,
      .refused,
      .altered,
      .declined {
        color: var(--stop);
      }
      #probe dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 10px;
        margin: 0;
        font-size: 13px;
      }
      #probe dt {
        color: var(--muted);
      }
      #probe dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #calls {
        max-height: 40vh;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Countersign</h1>
      <span
        >Simulated Alexa+ household device. MCP client over Streamable HTTP to a
        self-hosted Countersign server.</span
      >
    </header>
    <main>
      <section aria-label="Conversation">
        <h2>Who is speaking</h2>
        <div class="speakers" id="speakers"></div>
        <div id="log" aria-live="polite"></div>
        <form id="f">
          <button
            type="button"
            class="mic"
            id="mic"
            title="Hold a conversation by voice"
          >
            Speak
          </button>
          <input
            type="text"
            id="text"
            placeholder="Or type what the person says"
            autocomplete="off"
          />
          <button class="primary" type="submit">Send</button>
        </form>
        <div class="row">
          <label
            ><input type="checkbox" id="voice" checked /> Read replies
            aloud</label
          >
          <label class="redteam"
            ><input type="checkbox" id="red" /> Red-team: assistant obeys seller
            notes</label
          >
          <button type="button" id="reset">New conversation</button>
        </div>
      </section>
      <aside>
        <section id="probe" aria-label="MCP connection">
          <h2>MCP connection</h2>
          <dl>
            <dt>Protocol</dt>
            <dd id="pv">checking...</dd>
            <dt>Server</dt>
            <dd id="srv">-</dd>
            <dt>Tools</dt>
            <dd id="tools">-</dd>
            <dt>Ledger</dt>
            <dd id="ledger">-</dd>
          </dl>
          <div class="row">
            <button type="button" id="reprobe">Re-run handshake</button>
          </div>
        </section>
        <section aria-label="Tool calls" style="margin-top: 16px">
          <h2>Tool calls this session</h2>
          <div id="calls"><p class="row">None yet.</p></div>
        </section>
      </aside>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let speaker = null;

      async function loadMembers() {
        const roles = {
          guardian: "guardian",
          child: "child",
          protected_adult: "protected adult",
        };
        const members = await (await fetch("/api/members")).json();
        $("speakers").innerHTML = "";
        for (const m of members) {
          const b = document.createElement("button");
          b.className = "speaker";
          b.type = "button";
          b.setAttribute("aria-pressed", "false");
          b.innerHTML = `${m.name}<small>${roles[m.role] || m.role}</small>`;
          b.onclick = () => {
            speaker = m;
            document
              .querySelectorAll(".speaker")
              .forEach((x) => x.setAttribute("aria-pressed", "false"));
            b.setAttribute("aria-pressed", "true");
          };
          $("speakers").appendChild(b);
        }
        $("speakers").firstChild.click();
      }

      function add(cls, who, text) {
        const d = document.createElement("div");
        d.className = "msg " + cls;
        d.innerHTML = `<span class="who"></span>`;
        d.querySelector(".who").textContent = who;
        d.appendChild(document.createTextNode(text));
        $("log").appendChild(d);
        $("log").scrollTop = $("log").scrollHeight;
      }

      function addCalls(tools) {
        if (!tools.length) return;
        if ($("calls").querySelector("p")) $("calls").innerHTML = "";
        for (const t of tools) {
          const d = document.createElement("div");
          d.className = "call";
          const status =
            t.status == null
              ? ""
              : `<span class="chip ${t.status}">${t.status}</span>`;
          d.innerHTML = `<strong></strong>${status}<br><code></code>`;
          d.querySelector("strong").textContent = t.name;
          d.querySelector("code").textContent = JSON.stringify(t.input);
          $("calls").prepend(d);
        }
      }

      function speak(text) {
        if (!$("voice").checked || !("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      }

      async function send(text) {
        if (!text.trim() || !speaker) return;
        add("you", speaker.name, text);
        $("text").value = "";
        add("dev", "Device", "...");
        const thinking = $("log").lastChild;
        try {
          const r = await fetch("/api/turn", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              member_id: speaker.id,
              text,
              red_team: $("red").checked,
            }),
          });
          const out = await r.json();
          thinking.remove();
          if (out.error) {
            add("err", "Error", out.error);
            return;
          }
          add("dev", "Device", out.reply);
          addCalls(out.tools || []);
          speak(out.reply);
          probe();
        } catch (e) {
          thinking.remove();
          add("err", "Error", String(e));
        }
      }

      async function probe() {
        try {
          const p = await (await fetch("/api/probe")).json();
          $("pv").textContent = p.protocolVersion || "no answer";
          $("srv").textContent = p.server
            ? `${p.server.name} ${p.server.version || ""}`
            : "-";
          $("tools").textContent = (p.tools || [])
            .map((t) => t.name + (t.readOnly ? " (read-only)" : ""))
            .join(", ");
          const l = p.ledger || {};
          $("ledger").innerHTML =
            l.entries === undefined
              ? "-"
              : `<span class="chip ${l.ok ? "verified" : "altered"}">${l.ok ? "verified" : "altered"}</span> ${l.entries} entries${l.ok ? "" : ", first bad entry " + l.first_bad_entry}`;
        } catch (e) {
          $("pv").textContent = "server not reachable";
        }
      }

      $("f").onsubmit = (e) => {
        e.preventDefault();
        send($("text").value);
      };
      $("reset").onclick = async () => {
        await fetch("/api/reset", { method: "POST" });
        $("log").innerHTML = "";
      };
      $("reprobe").onclick = probe;

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SR) {
        const rec = new SR();
        rec.lang = "en-GB";
        rec.interimResults = false;
        rec.onresult = (e) => send(e.results[0][0].transcript);
        rec.onend = () => $("mic").classList.remove("on");
        $("mic").onclick = () => {
          $("mic").classList.add("on");
          rec.start();
        };
      } else {
        $("mic").disabled = true;
        $("mic").title = "Speech recognition needs Chrome or Edge";
      }

      loadMembers();
      probe();
    </script>
  </body>
</html>
